name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The corpus replay in test:engines reads public/corpus/all.jsonl,
          # which is stored in Git LFS.
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: npm run validate:release

      - name: Verify cipher engines
        run: npm run test:engines

      - name: Run test suites
        run: npm test

      - name: Lint HTML
        run: npm run lint:html

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install browser-check dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.64.1 @axe-core/playwright@4.14.0
          npx playwright install --with-deps chromium

      - name: Exercise the research additions in Chromium
        run: node scripts/check-dot-followups-browser.js

      - name: Keep browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: museum-dot-browser
          path: tmp/dot-browser/
          if-no-files-found: error

  validate-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate corpus schema (immutable v0.6 archive)
        run: npm run validate:corpus

      - name: Build corpus v0.7 from the v0.6 archive
        run: npm run build:corpus:v07

      - name: Verify the rebuilt v0.7 matches its committed checksum manifest
        working-directory: public/corpus/v0.7
        run: sha256sum -c SHA256SUMS.txt

      - name: Validate corpus v0.7 against its own contract
        run: npm run validate:corpus:v07

      - name: Build corrected corpus v0.8 from v0.7
        run: npm run build:corpus:v08

      - name: Verify the complete v0.8 download and generated files
        working-directory: public/corpus/v0.8
        run: sha256sum -c SHA256SUMS.txt

      - name: Validate corpus v0.8 against its own contract
        run: npm run validate:corpus:v08

      - name: Verify corrected v0.8 supporting downloads
        run: node scripts/build-corpus-v08-supplements.js --check

      - name: Verify v0.8 supplement checksums
        working-directory: public/corpus/v0.8
        run: sha256sum -c supplements-SHA256SUMS.txt

  deploy-pages:
    needs: [test, browser-tests, validate-corpus]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          lfs: true

      - name: Verify corpus download bytes
        working-directory: public/corpus
        run: sha256sum -c SHA256SUMS.txt

      - name: Verify corrected v0.8 download bytes
        working-directory: public/corpus/v0.8
        run: |
          test -s all.jsonl.gz
          sha256sum --ignore-missing -c SHA256SUMS.txt
          sha256sum -c supplements-SHA256SUMS.txt

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy validated Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
