<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Guided Tours — The Cipher Museum</title>
<meta name="description" content="Choose a curated tour path through the Cipher Museum: Mathematics of Secrecy, Ciphers at War, or The Hacker's Toolkit.">
<link rel="stylesheet" href="../css/museum.css">
<style>
.tour-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;margin-top:2.5rem}
.tour-tile{background:var(--s2);border:1px solid var(--gold-b);border-radius:var(--rl);padding:2.5rem;text-decoration:none;display:block;transition:all var(--trs)}
.tour-tile:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.4)}
.tour-icon{font-size:2.5rem;margin-bottom:1rem;display:block}
.tour-name{font-family:var(--fd);font-size:1.25rem;color:var(--tx);margin-bottom:.5rem;letter-spacing:.04em}
.tour-blurb{font-family:var(--fb);font-size:.92rem;color:var(--tx2);line-height:1.55;margin-bottom:1rem}
.tour-meta{font-family:var(--fm);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--tx3)}
.tour-progress-bar{margin-top:.75rem;height:4px;background:var(--s4);border-radius:2px;overflow:hidden}
.tour-progress-fill{height:100%;background:var(--gold-dim);border-radius:2px;transition:width .3s}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<nav class="museum-nav" aria-label="Primary">
  <div class="nav-inner">
    <a href="../index.html" class="nav-logo">
      <svg class="nav-logo-icon" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="16" r="8" stroke="currentColor" stroke-width="1"/><circle cx="16" cy="16" r="2" fill="currentColor"/><line x1="16" y1="2" x2="16" y2="6" stroke="currentColor" stroke-width="1.5"/><line x1="16" y1="26" x2="16" y2="30" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="16" x2="6" y2="16" stroke="currentColor" stroke-width="1.5"/><line x1="26" y1="16" x2="30" y2="16" stroke="currentColor" stroke-width="1.5"/></svg>
      <span class="nav-logo-text">The Cipher Museum</span>
    </a>
    <ul class="nav-links"></ul>
  </div>
</nav>

<section class="page-hero">
  <p class="hero-sub">Curated Experiences</p>
  <h1>Guided Tours</h1>
  <p class="hero-intro">Choose a path through the museum — each tour connects exhibits around a central theme, with historical context and connections you might otherwise miss.</p>
</section>

<main id="main-content" tabindex="-1" style="max-width:1000px;margin:0 auto;padding:0 2rem 4rem">

<div class="tour-grid" id="tourGrid"></div>

</main>

<footer></footer>

<script src="../js/nav.js" defer></script>
<script>
'use strict';
(function(){
  var TOURS = [
    {id:'mathematics', file:'mathematics.json'},
    {id:'foundations', file:'foundations.json'},
    {id:'wartime',     file:'wartime.json'},
    {id:'hacker',      file:'hacker.json'},
    {id:'unsolved-culture', file:'unsolved-culture.json'}
  ];

  var LS_PREFIX = 'ciphermuseum.tours.';
  var grid = document.getElementById('tourGrid');

  function getVisitedCount(id, total){
    try{
      var arr = JSON.parse(localStorage.getItem(LS_PREFIX + id + '.visited')) || [];
      return Math.min(arr.length, total);
    } catch(e){ return 0; }
  }

  function escapeHTML(s){
    var d = document.createElement('div');
    d.appendChild(document.createTextNode(s));
    return d.innerHTML;
  }

  TOURS.forEach(function(t){
    if (typeof fetch !== 'function') return;
    fetch(t.file)
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){
        var visited = getVisitedCount(t.id, data.stops.length);
        var pct = Math.round((visited / data.stops.length)*100);
        var tile = document.createElement('a');
        tile.href = 'tour.html?tour=' + encodeURIComponent(t.id);
        tile.className = 'tour-tile';
        tile.innerHTML =
          '<span class="tour-icon">' + escapeHTML(data.icon) + '</span>' +
          '<h2 class="tour-name">' + escapeHTML(data.title) + '</h2>' +
          '<p class="tour-blurb">' + escapeHTML(data.description) + '</p>' +
          '<div class="tour-meta">' + data.stops.length + ' stops · ' + visited + ' visited</div>' +
          '<div class="tour-progress-bar"><div class="tour-progress-fill" style="width:' + pct + '%"></div></div>';
        grid.appendChild(tile);
      })
      .catch(function(){ /* skip tours that fail to load rather than break the grid */ });
  });
})();
</script>
<script src="../js/lightbox.js"></script>
</body>
</html>
